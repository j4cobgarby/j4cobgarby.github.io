---
layout: default
---

<h1>{{page.title}}</h1>
<div class="post-meta">{{page.date | date: "%-d %B  %Y"}} — {{page.author}}
{%- if page.tags -%}
<br>
{% for tag in page.tags %}
<a class="tag" href="{{site.baseurl}}/listing#{{tag | slugize}}">#{{ tag }}</a>
{% endfor %}
{%- endif -%}
</div>

{{content}}
