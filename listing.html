---
layout: default
title: Blog Listing
---

{% for tag in site.tags %}
{% assign tag_name = tag | first %}
<span class="tag-name" id="#{{ tag_name | slugize}}">#{{tag_name}}</span>
<table class="listing">
  {% for post in site.tags[tag_name] %}
  <tr>
    <td class="date-cell">{{post.date | date: "%-d %B %Y"}}</td>
    <td><a href="{{post.url}}">{{post.title}}</a></td>
  </tr>  
  {% endfor %}
</table>
{% endfor %}
