<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --bg:#ffffff; --surface:#d6e4fc; --text:black; --muted:black;
    --border:rgba(0,0,0,.14); --border-strong:rgba(0,0,0,.28);
    --acc:#1d9e75; --rej:rgba(252, 60, 50, .8); --band:rgba(118, 167, 252, 0.1); --line:#1964e5; --idle:#888780;
    --radius:0px;
    --font:sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;padding:12px;padding-bottom:32px;background:var(--bg);color:var(--text);font-family:var(--font;);
       font-size:18px;line-height:1.6;-webkit-font-smoothing:antialiased}
  .wrap{max-width:800px;margin:0 auto;}
  .controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-bottom:1rem}
  .ctl{display:flex;align-items:center;gap:10px}
  .ctl label{font-size:16px;color:var(--muted);min-width:74px}
  .ctl output{font-size:16px;font-weight:500;min-width:34px;text-align:right}
  input[type=range]{flex:1;accent-color:var(--line);height:20px;min-width:0}
  button{font-size:13px;flex:1}
  :focus-visible{outline:2px solid var(--line);outline-offset:2px}
  canvas{width:100%;display:block}
  .key{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--muted);margin:6px 0 10px}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--acc)}
  .dash{display:inline-block;width:16px;border-top:1.5px dashed var(--idle);vertical-align:3px}
  .row{display:flex;gap:14px;align-items:flex-start}
  .statcol{flex:0 0 200px;background:var(--surface);border-radius:var(--radius);padding:6px 10px}
  .stat{display:flex;justify-content:space-between;align-items:baseline;gap:8px;
    font-size:14px;line-height:1.9;white-space:nowrap}
  .stat+.stat{border-top:1px solid var(--border)}
  .stat .lab{color:var(--muted);overflow:hidden;text-overflow:ellipsis}
  .stat .val{font-weight:500;font-variant-numeric:tabular-nums}
  .histbox{flex:1;min-width:0}
  .cap{font-size:14px;color:var(--muted);margin:0 0 2px}
  .off{opacity:.4}
</style>
</head>
<body>
<div class="wrap">
<div class="controls">
  <div class="ctl"><label for="sd">Mode</label>
    <select id="sd">
      <option value="sync">Synchronous</option>
      <option value="async">Asynchronous</option>
      <option value="ia" selected>Interval-Asynchrony</option>
    </select></div>
  <div class="ctl" id="yrow"><label for="sy">Interval, y</label>
    <input type="range" id="sy" min="1" max="24" step="1" value="6"><output id="oy">6</output></div>
  <div class="ctl"><label for="sm">Threads, m</label>
    <input type="range" id="sm" min="1" max="16" step="1" value="6"><output id="om">6</output></div>
  <div class="ctl"><label for="sv">Step jitter</label>
    <input type="range" id="sv" min="0" max="80" step="5" value="35"><output id="ov">35%</output></div>
  <div class="ctl"><label for="ss">Speed</label>
    <input type="range" id="ss" min="0.1" max="4" step="0.1" value="1"><output id="os">1.0&times;</output></div>
  <div class="ctl" style="gap:8px"><button id="bp" style="flex:1">Begin</button><button id="br" style="flex:1">Reset</button></div>
</div>

<canvas id="g"></canvas>

<div class="key">
  <span><span class="dot"></span> accepted</span>
  <span><span style="color:var(--rej);font-weight:500">&#10005;</span> rejected</span>
  <span><span class="dash"></span> idle at barrier</span>
  <span id="bandkey">shaded band = one asynchronous interval</span>
</div>

<div class="row">
  <div class="statcol" id="statcol">
    <div class="stat"><span class="lab">Accepted</span><span class="val" id="k1">&mdash;</span></div>
    <div class="stat"><span class="lab">Throughput</span><span class="val" id="k2">&mdash;</span></div>
    <div class="stat"><span class="lab">Mean staleness</span><span class="val" id="k3">&mdash;</span></div>
    <div class="stat"><span class="lab" id="k4l">Max staleness</span><span class="val" id="k4">&mdash;</span></div>
  </div>
  <div class="histbox">
    <div class="cap">Distribution of staleness, &tau;</div>
    <canvas id="h"></canvas>
  </div>
</div>
</div>

<script>
(function(){
const G=document.getElementById('g'),H=document.getElementById('h');
const gx=G.getContext('2d'),hx=H.getContext('2d');
const cs=getComputedStyle(document.documentElement);
const C=n=>cs.getPropertyValue(n).trim()||'#888780';
const ACC=C('--acc'),REJ=C('--rej'),BAND=C('--band'),LINE=C('--line'),IDLE=C('--idle'),MUT=C('--muted'),BOR=C('--border');
let y=6,m=6,jit=.35,spd=1,run=false,mode='ia';
const SPAN=8,MEAN=1.0;
let S;
function reset(){S={t:0,th:[],If:0,Id:0,ss:0,sd:0,steps:[],bounds:[0],hist:new Array(48).fill(0),na:0,nr:0,taus:0,maxt:0,idle:0,busy:0,round:null};document.getElementById('bp').textContent = "Begin";run=false;}
reset();
function rnd(){return MEAN*(1-jit+2*jit*Math.random());}
function acc(s,tau){s.s=1;s.tau=tau;S.na++;S.taus+=tau;if(tau>S.maxt)S.maxt=tau;if(tau<48)S.hist[tau]++;}

function tick(dt){
  S.t+=dt;
  if(mode==='sync'){
    if(!S.round){
      let e=0;S.round={list:[]};
      for(let w=0;w<m;w++){
        const s={w:w,i:S.ss++,t0:S.t,t1:S.t+rnd(),sd0:S.sd,s:-1,idle:0};
        S.round.list.push(s);S.steps.push(s);if(s.t1>e)e=s.t1;
      }
      S.round.end=e;
    }else if(S.t>=S.round.end){
      for(const s of S.round.list){acc(s,0);s.idle=S.round.end;S.busy+=s.t1-s.t0;S.idle+=S.round.end-s.t1;}
      S.sd++;S.bounds.push(S.round.end);S.round=null;
    }
  }else{
    for(let w=0;w<16;w++){
      const st=S.th[w];
      if(st&&st.t1<=S.t){
        S.th[w]=null;S.busy+=st.t1-st.t0;
        if(mode==='async'){acc(st,S.sd-st.sd0);S.sd++;}
        else if(st.i<S.If||S.Id>=y){st.s=0;S.nr++;}
        else{
          acc(st,S.sd-st.sd0);S.Id++;S.sd++;
          if(S.Id>=y){S.If=S.ss;S.Id=0;S.bounds.push(S.t);}
        }
      }
      if(!S.th[w]&&w<m){
        const s={w:w,i:S.ss++,t0:S.t,t1:S.t+rnd(),sd0:S.sd,s:-1,idle:0};
        S.th[w]=s;S.steps.push(s);
      }
    }
  }
  S.steps=S.steps.filter(s=>s.t1>S.t-SPAN-2);
  if(S.bounds.length>40)S.bounds=S.bounds.slice(-40);
}

function draw(){
  const W=G.clientWidth,rowH=24,Ht=m*rowH+16,dpr=devicePixelRatio||1;
  G.width=W*dpr;G.height=Ht*dpr;G.style.height=Ht+'px';
  gx.setTransform(dpr,0,0,dpr,0,0);gx.clearRect(0,0,W,Ht);
  const px=W/SPAN,X=t=>W-(S.t-t)*px;
  if(mode!=='async'){
    const b=S.bounds;
    for(let k=0;k<b.length;k++){
      if(mode==='ia'&&k%2===0){
        const x0=Math.max(0,X(b[k])),x1=k+1<b.length?X(b[k+1]):W;
        gx.fillStyle=BAND;gx.fillRect(x0,4,Math.max(0,x1-x0),Ht-12);
      }
      const xb=X(b[k]);
      if(xb>0&&xb<W){gx.strokeStyle=mode==='sync'?IDLE:LINE;gx.globalAlpha=.55;gx.setLineDash([3,3]);
        gx.beginPath();gx.moveTo(xb,4);gx.lineTo(xb,Ht-8);gx.stroke();gx.setLineDash([]);gx.globalAlpha=1;}
    }
  }
  gx.strokeStyle=BOR;gx.lineWidth=.5;
  for(let w=0;w<m;w++){const yy=12+w*rowH+6;gx.beginPath();gx.moveTo(0,yy+.5);gx.lineTo(W,yy+.5);gx.stroke();}
  for(const s of S.steps){
    if(s.w>=m)continue;
    const yy=12+s.w*rowH+6,x0=X(s.t0),x1=Math.min(X(s.t1),W);
    const ie=s.s===1?(s.idle||0):(mode==='sync'&&S.t>s.t1?S.t:0);
    if(ie>s.t1){
      gx.strokeStyle=IDLE;gx.lineWidth=1.4;gx.globalAlpha=.6;gx.setLineDash([3,3]);
      gx.beginPath();gx.moveTo(x1,yy);gx.lineTo(Math.min(X(ie),W),yy);gx.stroke();
      gx.setLineDash([]);gx.globalAlpha=1;
    }
    gx.strokeStyle=s.s===1?ACC:(s.s===0?REJ:MUT);
    gx.lineWidth=s.s===-1?1.4:2;gx.globalAlpha=s.s===-1?.55:1;
    gx.beginPath();gx.moveTo(x0,yy);gx.lineTo(x1,yy);gx.stroke();gx.globalAlpha=1;
    if(s.s===1){gx.fillStyle=ACC;gx.beginPath();gx.arc(x1,yy,3.5,0,7);gx.fill();}
    else if(s.s===0){gx.strokeStyle=REJ;gx.lineWidth=1.6;gx.beginPath();
      gx.moveTo(x1-3,yy-3);gx.lineTo(x1+3,yy+3);gx.moveTo(x1+3,yy-3);gx.lineTo(x1-3,yy+3);gx.stroke();}
  }
}

const STATCOL=document.getElementById('statcol'),CAP=document.querySelector('.cap');
function drawHist(){
  const W=H.clientWidth,dpr=devicePixelRatio||1;
  const Ht=Math.max(70,STATCOL.offsetHeight-CAP.offsetHeight-2);
  H.width=W*dpr;H.height=Ht*dpr;H.style.height=Ht+'px';
  hx.setTransform(dpr,0,0,dpr,0,0);hx.clearRect(0,0,W,Ht);
  let n=8;
  if(mode==='ia')n=Math.min(48,Math.max(y+4,8));
  else if(mode==='async')n=Math.min(48,Math.max(m*3,8));
  const mx=Math.max(1,...S.hist.slice(0,n)),bw=W/n;
  for(let i=0;i<n;i++){
    const h=(S.hist[i]/mx)*(Ht-22);
    hx.fillStyle=(mode==='ia'&&i>=y)?MUT:LINE;
    hx.globalAlpha=(mode==='ia'&&i>=y)?.3:.85;
    hx.fillRect(i*bw+1,Ht-20-h,Math.max(1,bw-2),h);
  }
  hx.globalAlpha=1;
  if(mode==='ia'){
    const xb=Math.min(n,y)*bw;
    hx.strokeStyle=REJ;hx.setLineDash([4,3]);hx.beginPath();hx.moveTo(xb,2);hx.lineTo(xb,Ht-20);hx.stroke();hx.setLineDash([]);
    hx.fillStyle=REJ;hx.font='11px '+C('--font');hx.textAlign='left';
    if(xb<W-80)hx.fillText('hard bound \u03C4 \u2264 y',xb+5,12);
  }
  hx.fillStyle=MUT;hx.font='11px '+C('--font');hx.textAlign='center';
  const stp=Math.ceil(n/8);
  for(let i=0;i<n;i+=stp)hx.fillText(i,i*bw+bw/2,Ht-6);
}

function stats(){
  const tot=S.na+S.nr;
  document.getElementById('k1').textContent=tot?Math.round(100*S.na/tot)+'%':'\u2014';
  document.getElementById('k2').textContent=S.t>1?(S.na/S.t).toFixed(1)+'/s':'\u2014';
  document.getElementById('k3').textContent=S.na?(S.taus/S.na).toFixed(1):'\u2014';
  if(mode==='sync'){
    document.getElementById('k4l').textContent='Time idle';
    const tt=S.busy+S.idle;
    document.getElementById('k4').textContent=tt>0?Math.round(100*S.idle/tt)+'%':'\u2014';
  }else{
    document.getElementById('k4l').textContent='Max staleness';
    document.getElementById('k4').textContent=S.na?S.maxt:'\u2014';
  }
}

let lastH=0;
function postHeight(){
  const h=Math.ceil(document.documentElement.getBoundingClientRect().height);
  if(h!==lastH){lastH=h;parent.postMessage({type:'ia-sim-height',height:h},'*');}
}

let last=0;
function loop(ts){
  if(!last)last=ts;
  const dt=Math.min(.05,(ts-last)/1000)*1.4*spd;last=ts;
  if(run)tick(dt);
  draw();drawHist();stats();postHeight();
  requestAnimationFrame(loop);
}

function syncUI(){
  const on=mode==='ia';
  document.getElementById('yrow').classList.toggle('off',!on);
  document.getElementById('sy').disabled=!on;
  document.getElementById('bandkey').style.display=on?'':'none';
}
const bind=(id,out,fn,fmt)=>{const e=document.getElementById(id);
  e.addEventListener('input',()=>{fn(+e.value);document.getElementById(out).textContent=fmt?fmt(+e.value):e.value;});};
bind('sy','oy',v=>{y=v;});
bind('sm','om',v=>{m=v;reset();});
bind('sv','ov',v=>{jit=v/100;},v=>v+'%');
bind('ss','os',v=>{spd=v;},v=>v.toFixed(1)+'\u00D7');
document.getElementById('sd').addEventListener('change',e=>{mode=e.target.value;reset();syncUI();});
document.getElementById('bp').addEventListener('click',e=>{run=!run;e.target.textContent=run?'Pause':'Resume';});
document.getElementById('br').addEventListener('click',reset);
syncUI();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
